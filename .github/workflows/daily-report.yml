name: Bremo Daily Report Auto Update

on:
  schedule:
    # ※ これらの cron 文字列は src/config.js の SCHEDULES と必ず一致させること
    #   （通知ロジックが github.event.schedule の文字列で「どの枠か」を判定するため）。
    #   混雑する :00/:30 はGitHub側のスケジュール遅延が大きいので、半端な分にして遅延を抑える。
    - cron: '47 21 * * *'   # 06:47 JST プライマリ（ca-now.jpの朝の不応答窓 7:30-8:30 の手前で取得を狙う）
    # リカバリ/監視枠: 朝の不応答で失敗した日を自動再取込（取込済みならno-op・無通知。importerはB列実日付で冪等）
    - cron: '53 23 * * *'   # 08:53 JST リカバリ（木曜の週報マスタ転記 9-10時 の手前）
    - cron: '3 1 * * *'     # 10:03 JST watchdog（ここで未取込なら「1通だけ」警報して沈黙放置を防ぐ）
    - cron: '7 5 * * *'     # 14:07 JST 最終枠（ここでも失敗なら警報）
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD) 空欄=自動判定'
        required: false
      end_date:
        description: '終了日 (YYYY-MM-DD) 空欄=昨日'
        required: false

env:
  ECFORCE_EMAIL: ${{ secrets.ECFORCE_EMAIL }}
  ECFORCE_PASSWORD: ${{ secrets.ECFORCE_PASSWORD }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
  CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
  START_DATE: ${{ github.event.inputs.start_date }}
  END_DATE: ${{ github.event.inputs.end_date }}
  # どのcron枠で起動したか(リカバリ枠の通知抑制に使用。手動実行時は空)
  TRIGGER_SCHEDULE: ${{ github.event.schedule }}
  # 2026-06-16からGitHub ActionsはNode24が強制される。先行オプトインで事前検証済みにする
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# 同一workflowのRunを直列化する。プライマリが朝の不応答で最大18分粘っている最中に
# 後続のリカバリ枠が起動すると、二重ログイン・二重書込み（過去の二重取込バグの温床）に
# なりうるため、進行中のRunが終わるまで後続をキューイングする（進行中はキャンセルしない）。
concurrency:
  group: bremo-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # ログイン時間予算(最大18分)＋セットアップ/CSV取得/書込みの余裕

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run automation
        run: node src/index.js

      # 一時不応答での通知抑制時はジョブが成功扱い(exit 0)になるため、if: failure() だと
      # ログイン失敗スクショ(login-attempt-N-failed.png)が残らない。常に回収する(空なら何もしない)。
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
