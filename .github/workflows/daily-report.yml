name: Bremo Daily Report Auto Update

on:
  schedule:
    # 毎朝 07:00 JST = 22:00 UTC (前日) — プライマリ
    - cron: '0 22 * * *'
    # リカバリ枠: ecforce(ca-now.jp)の朝方不応答で失敗した日を自動再取込
    # (取込済みの日はno-opで通知も出ない。importerはB列実日付で冪等)
    - cron: '30 1 * * *'  # 10:30 JST
    - cron: '0 5 * * *'   # 14:00 JST
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD) 空欄=自動判定'
        required: false
      end_date:
        description: '終了日 (YYYY-MM-DD) 空欄=昨日'
        required: false

env:
  ECFORCE_EMAIL: ${{ secrets.ECFORCE_EMAIL }}
  ECFORCE_PASSWORD: ${{ secrets.ECFORCE_PASSWORD }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
  CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
  START_DATE: ${{ github.event.inputs.start_date }}
  END_DATE: ${{ github.event.inputs.end_date }}
  # どのcron枠で起動したか(リカバリ枠の通知抑制に使用。手動実行時は空)
  TRIGGER_SCHEDULE: ${{ github.event.schedule }}
  # 2026-06-16からGitHub ActionsはNode24が強制される。先行オプトインで事前検証済みにする
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ログインリトライ(最大3回×90秒待ち)分の余裕

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run automation
        run: node src/index.js

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
