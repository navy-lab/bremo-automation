name: Bremo Daily Report Auto Update

on:
  schedule:
    # 毎朝 07:00 JST = 22:00 UTC (前日)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD) 空欄=自動判定'
        required: false
      end_date:
        description: '終了日 (YYYY-MM-DD) 空欄=昨日'
        required: false

env:
  ECFORCE_EMAIL: ${{ secrets.ECFORCE_EMAIL }}
  ECFORCE_PASSWORD: ${{ secrets.ECFORCE_PASSWORD }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
  CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
  START_DATE: ${{ github.event.inputs.start_date }}
  END_DATE: ${{ github.event.inputs.end_date }}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run automation
        run: node src/index.js

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
